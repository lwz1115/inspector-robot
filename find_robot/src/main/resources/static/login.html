<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>园区巡检监控系统 - 登录</title>
  <link href="//unpkg.com/layui@2.13.0/dist/css/layui.css" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{background:linear-gradient(135deg,#0c1a2d,#1a3a5f);display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:'Microsoft YaHei',sans-serif}
    .wrap{display:flex;flex-direction:column;align-items:center;gap:20px}
    .card{width:400px;background:rgba(255,255,255,.96);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);overflow:hidden;transition:.3s}
    .card:hover{transform:translateY(-4px);box-shadow:0 15px 35px rgba(0,0,0,.25)}
    .card-header{background:linear-gradient(135deg,#00f2fe,#4facfe);padding:28px 20px;text-align:center;color:#fff}
    .card-header h2{margin:0;font-size:22px}
    .card-header p{margin:8px 0 0;opacity:.9;font-size:13px}
    .card-body{padding:28px}
    .layui-form-item{margin-bottom:18px}
    .layui-input-wrap{border-radius:6px;overflow:hidden;border:1px solid #e0e0e0;transition:.3s}
    .layui-input-wrap:focus-within{border-color:#00d4ff;box-shadow:0 0 0 2px rgba(0,212,255,.18)}
    .layui-input-prefix{background:#f8f8f8}
    .layui-input{border:none;background:transparent}
    .layui-btn{background:linear-gradient(135deg,#00f2fe,#4facfe);border:none;border-radius:6px;height:42px;font-size:15px;transition:.3s}
    .layui-btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,212,255,.35)}
    .layui-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .footer-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13px}
    .footer-row a{color:#00c4e8;text-decoration:none}
    .footer-row a:hover{text-decoration:underline}
    .sys-info{text-align:center;color:rgba(255,255,255,.6);font-size:12px}
    .sys-info p{margin:4px 0}
    @media(max-width:440px){.card{width:92%}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="card-header">
      <h2>🏭 园区巡检监控系统</h2>
      <p>欢迎登录，请输入账号密码</p>
    </div>
    <div class="card-body">
      <form class="layui-form" id="loginForm">
        <div class="layui-form-item">
          <div class="layui-input-wrap">
            <div class="layui-input-prefix"><i class="layui-icon layui-icon-username"></i></div>
            <input type="text" name="username" id="username" lay-verify="required" placeholder="用户名" autocomplete="username" class="layui-input" maxlength="50">
          </div>
        </div>
        <div class="layui-form-item">
          <div class="layui-input-wrap">
            <div class="layui-input-prefix"><i class="layui-icon layui-icon-password"></i></div>
            <input type="password" name="password" id="password" lay-verify="required" placeholder="密码" autocomplete="current-password" class="layui-input" lay-affix="eye" maxlength="255">
          </div>
        </div>
        <div class="footer-row">
          <label><input type="checkbox" id="rememberMe" lay-skin="primary"> 记住用户名</label>
          <div><a href="forgot.html" style="margin-right:12px;color:#aaa">忘记密码？</a><a href="register.html">注册新账号</a></div>
        </div>
        <div class="layui-form-item">
          <button class="layui-btn layui-btn-fluid" lay-submit lay-filter="login" id="loginBtn">登 录</button>
        </div>
      </form>
    </div>
  </div>
  <div class="sys-info">
    <p>园区智能巡检监控系统 v2.0</p>
  </div>
</div>

<script src="//unpkg.com/layui@2.13.0/dist/layui.js"></script>
<script>
layui.use(function () {
  var form = layui.form, layer = layui.layer, $ = layui.$;
  var BASE = window.location.protocol + '//' + window.location.hostname + ':8080';

  // 已登录则直接跳转
  if (localStorage.getItem('userId')) {
    window.location.replace('index.html');
    return;
  }

  // 恢复记住的用户名
  var saved = localStorage.getItem('rememberedUser');
  if (saved) { $('#username').val(saved); $('#rememberMe').prop('checked', true); form.render(); }

  form.on('submit(login)', function (data) {
    var f = data.field;
    var username = (f.username || '').trim();
    var password = f.password || '';

    if (!username) { layer.msg('请输入用户名', {icon: 2}); return false; }
    if (!password) { layer.msg('请输入密码',   {icon: 2}); return false; }

    var btn = document.getElementById('loginBtn');
    btn.disabled = true;
    var load = layer.load(1, {shade: [0.15, '#000']});

    $.ajax({
      url: BASE + '/api/auth/login',
      type: 'POST',
      data: { username: username, password: password },
      timeout: 8000,
      success: function (res) {
        layer.close(load);
        btn.disabled = false;
        if (res && res.success) {
          // 记住用户名
          if ($('#rememberMe').prop('checked')) localStorage.setItem('rememberedUser', username);
          else localStorage.removeItem('rememberedUser');

          localStorage.setItem('userId',          res.userId);
          localStorage.setItem('currentUsername', res.username);
          localStorage.setItem('nickname',        res.nickname || res.username);
          localStorage.setItem('loginTime',       Date.now());

          // 记录登录历史（最多保留10条）
          var history = [];
          try { history = JSON.parse(localStorage.getItem('loginHistory') || '[]'); } catch(_) {}
          var now = new Date();
          var timeStr = now.getFullYear() + '-' +
            String(now.getMonth()+1).padStart(2,'0') + '-' +
            String(now.getDate()).padStart(2,'0') + ' ' +
            String(now.getHours()).padStart(2,'0') + ':' +
            String(now.getMinutes()).padStart(2,'0');
          history.unshift({ time: timeStr, ip: window.location.hostname });
          if (history.length > 10) history = history.slice(0, 10);
          localStorage.setItem('loginHistory', JSON.stringify(history));
          // 今日登录次数
          var todayKey = now.toDateString();
          if (localStorage.getItem('sessionDay') !== todayKey) {
            localStorage.setItem('sessionDay', todayKey);
            localStorage.setItem('todaySessions', '1');
          } else {
            localStorage.setItem('todaySessions', String(parseInt(localStorage.getItem('todaySessions') || '0') + 1));
          }

          layer.msg('登录成功', {icon: 1, time: 1000}, function () {
            window.location.href = 'index.html';
          });
        } else {
          layer.msg(res.message || '登录失败', {icon: 2});
        }
      },
      error: function (xhr) {
        layer.close(load);
        btn.disabled = false;
        if (xhr.status === 0 || xhr.statusText === 'timeout') {
          layer.msg('连接超时，请检查网络或后端服务', {icon: 2});
        } else {
          layer.msg('请求失败（' + xhr.status + '）', {icon: 2});
        }
      }
    });
    return false;
  });
});
</script>
</body>
</html>
