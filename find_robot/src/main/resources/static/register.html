<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户注册 - 园区巡检监控系统</title>
  <link href="//unpkg.com/layui@2.13.0/dist/css/layui.css" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{background:linear-gradient(135deg,#0c1a2d,#1a3a5f);display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:'Microsoft YaHei',sans-serif}
    .wrap{display:flex;flex-direction:column;align-items:center;gap:20px}
    .card{width:460px;background:rgba(255,255,255,.96);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);overflow:hidden;transition:.3s}
    .card:hover{transform:translateY(-4px);box-shadow:0 15px 35px rgba(0,0,0,.25)}
    .card-header{background:linear-gradient(135deg,#00f2fe,#4facfe);padding:26px 20px;text-align:center;color:#fff}
    .card-header h2{margin:0;font-size:22px}
    .card-header p{margin:8px 0 0;opacity:.9;font-size:13px}
    .card-body{padding:26px}
    .layui-form-item{margin-bottom:14px}
    .layui-input-wrap{border-radius:6px;overflow:hidden;border:1px solid #e0e0e0;transition:.3s}
    .layui-input-wrap:focus-within{border-color:#00d4ff;box-shadow:0 0 0 2px rgba(0,212,255,.18)}
    .layui-input-prefix{background:#f8f8f8}
    .layui-input{border:none;background:transparent}
    .layui-btn{background:linear-gradient(135deg,#00f2fe,#4facfe);border:none;border-radius:6px;height:42px;font-size:15px;transition:.3s}
    .layui-btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,212,255,.35)}
    .layui-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
    /* 验证码行 */
    .code-row{display:flex;gap:8px}
    .code-row .layui-input-wrap{flex:1}
    .send-btn{flex-shrink:0;height:38px;padding:0 14px;font-size:13px;white-space:nowrap;background:linear-gradient(135deg,#00f2fe,#4facfe);border:none;border-radius:6px;color:#fff;cursor:pointer;transition:.3s}
    .send-btn:hover:not(:disabled){box-shadow:0 3px 10px rgba(0,212,255,.4)}
    .send-btn:disabled{opacity:.6;cursor:not-allowed}
    .pwd-strength{font-size:12px;margin-top:4px;height:16px}
    .pwd-strength.weak{color:#ff4d4f}
    .pwd-strength.medium{color:#faad14}
    .pwd-strength.strong{color:#52c41a}
    .footer-row{text-align:center;margin-top:10px;font-size:13px}
    .footer-row a{color:#00c4e8;text-decoration:none}
    .footer-row a:hover{text-decoration:underline}
    .sys-info{text-align:center;color:rgba(255,255,255,.6);font-size:12px}
    .sys-info p{margin:4px 0}
    @media(max-width:500px){.card{width:94%}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="card-header">
      <h2>创建新账户</h2>
      <p>注册成为园区智能巡检系统用户</p>
    </div>
    <div class="card-body">
      <form class="layui-form" id="regForm">
        <!-- 用户名 -->
        <div class="layui-form-item">
          <div class="layui-input-wrap">
            <div class="layui-input-prefix"><i class="layui-icon layui-icon-username"></i></div>
            <input type="text" name="username" id="reg-username" placeholder="用户名（3~50个字符）" autocomplete="username" class="layui-input" maxlength="50">
          </div>
        </div>
        <!-- 密码 -->
        <div class="layui-form-item">
          <div class="layui-input-wrap">
            <div class="layui-input-prefix"><i class="layui-icon layui-icon-password"></i></div>
            <input type="password" name="password" id="reg-password" placeholder="密码（至少6位）" autocomplete="new-password" class="layui-input" lay-affix="eye" maxlength="255">
          </div>
          <div class="pwd-strength" id="pwd-strength"></div>
        </div>
        <!-- 手机号 -->
        <div class="layui-form-item">
          <div class="layui-input-wrap">
            <div class="layui-input-prefix"><i class="layui-icon layui-icon-cellphone"></i></div>
            <input type="tel" name="phone" id="reg-phone" placeholder="手机号" autocomplete="tel" class="layui-input" maxlength="11">
          </div>
        </div>
        <!-- 邮箱 + 发送验证码 -->
        <div class="layui-form-item">
          <div class="code-row">
            <div class="layui-input-wrap">
              <div class="layui-input-prefix"><i class="layui-icon layui-icon-email"></i></div>
              <input type="email" name="email" id="reg-email" placeholder="QQ邮箱或其他邮箱" autocomplete="email" class="layui-input" maxlength="100">
            </div>
            <button type="button" class="send-btn" id="sendCodeBtn" onclick="sendCode()">发送验证码</button>
          </div>
        </div>
        <!-- 验证码输入 -->
        <div class="layui-form-item">
          <div class="layui-input-wrap">
            <div class="layui-input-prefix"><i class="layui-icon layui-icon-vercode"></i></div>
            <input type="text" name="emailCode" id="reg-code" placeholder="邮箱验证码（6位）" autocomplete="one-time-code" class="layui-input" maxlength="6">
          </div>
        </div>
        <!-- 昵称 -->
        <div class="layui-form-item">
          <div class="layui-input-wrap">
            <div class="layui-input-prefix"><i class="layui-icon layui-icon-username"></i></div>
            <input type="text" name="nickname" id="reg-nickname" placeholder="昵称（可选）" autocomplete="off" class="layui-input" lay-affix="clear" maxlength="100">
          </div>
        </div>
        <div class="layui-form-item">
          <button class="layui-btn layui-btn-fluid" lay-submit lay-filter="register" id="regBtn">注 册</button>
        </div>
        <div class="footer-row"><a href="login.html">已有账号？立即登录</a></div>
      </form>
    </div>
  </div>
  <div class="sys-info"><p>园区智能巡检监控系统 v2.0</p></div>
</div>

<script src="//unpkg.com/layui@2.13.0/dist/layui.js"></script>
<script>
var BASE = window.location.protocol + '//' + window.location.hostname + ':8080';
var countdownTimer = null;

// 发送验证码
function sendCode() {
  var email = document.getElementById('reg-email').value.trim();
  if (!email) { layui.layer.msg('请先输入邮箱', {icon: 2}); return; }
  if (!/^[\w.+-]+@[\w-]+\.[\w.]+$/.test(email)) { layui.layer.msg('邮箱格式不正确', {icon: 2}); return; }

  var btn = document.getElementById('sendCodeBtn');
  btn.disabled = true;

  layui.$.ajax({
    url: BASE + '/api/auth/email/send',
    type: 'POST',
    data: { email: email },
    timeout: 10000,
    success: function (res) {
      if (res && res.success) {
        layui.layer.msg('验证码已发送，请查收邮件', {icon: 1});
        startCountdown(btn, 60);
      } else {
        layui.layer.msg(res.message || '发送失败', {icon: 2});
        btn.disabled = false;
      }
    },
    error: function () {
      layui.layer.msg('网络异常，请重试', {icon: 2});
      btn.disabled = false;
    }
  });
}

// 倒计时
function startCountdown(btn, seconds) {
  clearInterval(countdownTimer);
  var left = seconds;
  btn.textContent = left + 's后重发';
  countdownTimer = setInterval(function () {
    left--;
    if (left <= 0) {
      clearInterval(countdownTimer);
      btn.disabled = false;
      btn.textContent = '重新发送';
    } else {
      btn.textContent = left + 's后重发';
    }
  }, 1000);
}

layui.use(function () {
  var form = layui.form, layer = layui.layer, $ = layui.$;

  // 密码强度
  $('#reg-password').on('input', function () {
    var p = $(this).val(), el = $('#pwd-strength');
    if (!p) { el.text('').attr('class', 'pwd-strength'); return; }
    var score = 0;
    if (p.length >= 6)           score++;
    if (p.length >= 10)          score++;
    if (/[a-z]/.test(p))         score++;
    if (/[A-Z]/.test(p))         score++;
    if (/[0-9]/.test(p))         score++;
    if (/[^a-zA-Z0-9]/.test(p))  score++;
    if (score <= 2)      el.text('密码强度：弱').attr('class', 'pwd-strength weak');
    else if (score <= 4) el.text('密码强度：中').attr('class', 'pwd-strength medium');
    else                 el.text('密码强度：强').attr('class', 'pwd-strength strong');
  });

  form.on('submit(register)', function (data) {
    var f = data.field;
    var username  = (f.username  || '').trim();
    var password  =  f.password  || '';
    var phone     = (f.phone     || '').trim();
    var email     = (f.email     || '').trim();
    var emailCode = (f.emailCode || '').trim();
    var nickname  = (f.nickname  || '').trim();

    if (!username)              { layer.msg('请输入用户名', {icon: 2}); return false; }
    if (username.length < 3)    { layer.msg('用户名至少3个字符', {icon: 2}); return false; }
    if (!password)              { layer.msg('请输入密码', {icon: 2}); return false; }
    if (password.length < 6)    { layer.msg('密码至少6位', {icon: 2}); return false; }
    if (!phone)                 { layer.msg('请输入手机号', {icon: 2}); return false; }
    if (!/^1[3-9]\d{9}$/.test(phone)) { layer.msg('手机号格式不正确', {icon: 2}); return false; }
    if (!email)                 { layer.msg('请输入邮箱', {icon: 2}); return false; }
    if (!emailCode)             { layer.msg('请输入邮箱验证码', {icon: 2}); return false; }
    if (emailCode.length !== 6) { layer.msg('验证码为6位数字', {icon: 2}); return false; }

    var btn = document.getElementById('regBtn');
    btn.disabled = true;
    var load = layer.load(1, {shade: [0.15, '#000']});

    $.ajax({
      url: BASE + '/api/auth/register',
      type: 'POST',
      data: { username: username, password: password, phone: phone, email: email, emailCode: emailCode, nickname: nickname || username },
      timeout: 10000,
      success: function (res) {
        layer.close(load);
        btn.disabled = false;
        if (res && res.success) {
          layer.msg('注册成功！', {icon: 1, time: 1500}, function () {
            window.location.href = 'login.html';
          });
        } else {
          layer.msg(res.message || '注册失败', {icon: 2});
        }
      },
      error: function (xhr) {
        layer.close(load);
        btn.disabled = false;
        layer.msg(xhr.status === 0 ? '连接超时，请检查网络' : '请求失败（' + xhr.status + '）', {icon: 2});
      }
    });
    return false;
  });
});
</script>
</body>
</html>
