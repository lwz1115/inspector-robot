<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户注册</title>
    <link href="//unpkg.com/layui@2.13.0/dist/css/layui.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0c1a2d 0%, #1a3a5f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        .register-container {
            width: 450px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .register-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .register-header {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }

        .register-header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
        }

        .register-header p {
            margin: 10px 0 0;
            opacity: 0.9;
            font-size: 14px;
        }

        .register-body {
            padding: 30px;
        }

        .layui-form-item {
            margin-bottom: 20px;
        }

        .layui-input-wrap {
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #e6e6e6;
            transition: all 0.3s ease;
        }

        .layui-input-wrap:focus-within {
            border-color: #00f2fe;
            box-shadow: 0 0 0 2px rgba(0, 242, 254, 0.2);
        }

        .layui-input-prefix {
            background-color: #f8f8f8;
        }

        .layui-input {
            border: none;
            background: transparent;
        }

        .layui-btn {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 6px;
            height: 44px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .layui-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }

        .register-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .register-footer a {
            color: #00f2fe;
            text-decoration: none;
            transition: color 0.3s;
        }

        .register-footer a:hover {
            color: #4facfe;
            text-decoration: underline;
        }

        .system-info {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }

        .system-info p {
            margin: 5px 0;
        }

        @media (max-width: 480px) {
            .register-container {
                width: 90%;
                margin: 20px auto;
            }
        }

        .password-strength {
            margin-top: 5px;
            font-size: 12px;
            display: none;
        }

        .password-strength.weak {
            color: #ff4d4f;
        }

        .password-strength.medium {
            color: #faad14;
        }

        .password-strength.strong {
            color: #52c41a;
        }
    </style>
</head>
<body>
<div>
    <div class="register-container">
        <div class="register-header">
            <h2>创建新账户</h2>
            <p>注册成为园区智能巡检系统用户</p>
        </div>
        <div class="register-body">
            <form class="layui-form">
                <div class="layui-form-item">
                    <div class="layui-input-wrap">
                        <div class="layui-input-prefix">
                            <i class="layui-icon layui-icon-username"></i>
                        </div>
                        <input type="text" name="username" value="" lay-verify="required" placeholder="用户名" lay-reqtext="请填写用户名" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-wrap">
                        <div class="layui-input-prefix">
                            <i class="layui-icon layui-icon-password"></i>
                        </div>
                        <input type="password" name="password" value="" lay-verify="required" placeholder="密码" autocomplete="off" class="layui-input" id="reg-password" lay-affix="eye">
                    </div>
                    <div class="password-strength" id="password-strength"></div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-wrap">
                        <div class="layui-input-prefix">
                            <i class="layui-icon layui-icon-cellphone"></i>
                        </div>
                        <input type="text" name="phone" value="" lay-verify="required|phone" placeholder="手机号" lay-reqtext="请填写手机号" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-wrap">
                        <div class="layui-input-prefix">
                            <i class="layui-icon layui-icon-username"></i>
                        </div>
                        <input type="text" name="nickname" value="" placeholder="昵称（可选）" autocomplete="off" class="layui-input" lay-affix="clear">
                    </div>
                </div>
                <div class="layui-form-item">
                    <button class="layui-btn layui-btn-fluid" lay-submit lay-filter="demo-reg">注册</button>
                </div>
                <div class="register-footer">
                    <a href="login.html">已有账号？立即登录</a>
                </div>
            </form>
        </div>
    </div>
    <div class="system-info">
        <p>园区智能巡检监控系统 v2.0</p>
        <p>© 2023 智能园区技术有限公司 版权所有</p>
    </div>
</div>

<script src="//unpkg.com/layui@2.13.0/dist/layui.js"></script>
<script>
    layui.use(function(){
        var $ = layui.$;
        var form = layui.form;
        var layer = layui.layer;

        // 密码强度检测
        $('#reg-password').on('input', function() {
            var password = $(this).val();
            var strength = $('#password-strength');

            if (password.length === 0) {
                strength.hide();
                return;
            }

            strength.show();

            // 简单的密码强度检测逻辑
            var score = 0;
            if (password.length >= 6) score++;
            if (password.match(/[a-z]/)) score++;
            if (password.match(/[A-Z]/)) score++;
            if (password.match(/[0-9]/)) score++;
            if (password.match(/[^a-zA-Z0-9]/)) score++;

            if (score <= 2) {
                strength.text('密码强度：弱').removeClass().addClass('password-strength weak');
            } else if (score <= 4) {
                strength.text('密码强度：中').removeClass().addClass('password-strength medium');
            } else {
                strength.text('密码强度：强').removeClass().addClass('password-strength strong');
            }
        });

        // 注册提交：使用POST请求
        form.on('submit(demo-reg)', function(data){
            var field = data.field;
            console.log('注册提交:', field);

            var loadIndex = layer.load(1, {shade: [0.1, '#fff']});

            // 使用POST请求
            $.ajax({
                url: window.location.protocol + '//' + window.location.hostname + ':8080/api/auth/register',
                type: 'POST',
                data: {
                    username: field.username,
                    password: field.password,
                    phone: field.phone,
                    nickname: field.nickname || field.username
                },
                success: function(res) {
                    layer.close(loadIndex);
                    console.log('注册响应:', res);
                    if(res.success) {
                        layer.msg('注册成功！2秒后跳转到登录页面', {icon: 1, time: 2000}, function(){
                            window.location.href = 'login.html';
                        });
                    } else {
                        layer.msg(res.message, {icon: 2});
                    }
                },
                error: function(xhr, status, error) {
                    layer.close(loadIndex);
                    console.error('注册请求失败:', error);
                    if (xhr.status === 0) {
                        layer.msg('无法连接到服务器，请检查后端服务是否启动', {icon: 2});
                    } else {
                        layer.msg('注册失败：' + error, {icon: 2});
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
